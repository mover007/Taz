plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'com.gradleup.shadow' version "${shadow_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Mod Menu (optional): only compiled against, so the config button works when it's installed.
	maven {
		name = "Terraformers"
		url = "https://maven.terraformersmc.com/releases/"
	}
	// MoulConfig: the settings GUI SkyHanni uses. Bundled into the jar under com.taz.deps.moulconfig.
	maven {
		name = "NotEnoughUpdates"
		url = "https://maven.notenoughupdates.org/releases/"
	}
}

configurations {
	shade
	implementation.extendsFrom shade
}

loom {
	// MoulConfig's access widener, applied by Taz since the library is bundled.
	accessWidenerPath = file("src/main/resources/taz.accesswidener")
	runs {
		// Dev only: replays run/config/taz/dungeons/history.json + run/logs through the predictor,
		// writes run/config/taz/dungeons/backtest.txt and exits.
		backtest {
			client()
			name = "Backtest"
			vmArgs "-Ddrp.backtest=M6,M7", "-Ddrp.backtest.exit=true"
		}
	}
}

// In-game tests (./gradlew runClientGameTest): XP Assist screens and progress detection, Galatea trees,
// and the settings GUI. Screenshots go to build/run/clientGameTest/screenshots.
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "taz-gametest"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	// MoulConfig is partly Kotlin, so Taz needs Fabric Language Kotlin at runtime (SkyHanni needs it too).
	implementation "net.fabricmc:fabric-language-kotlin:${project.fabric_kotlin_version}"
	shade("org.notenoughupdates.moulconfig:modern-26.1:${project.moulconfig_version}") { transitive = false }
	compileOnly("com.terraformersmc:modmenu:${project.modmenu_version}") { transitive = false }
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// The plain jar has no MoulConfig in it; the shadow jar (taz-<version>.jar) is the one to install.
jar {
	archiveClassifier = "slim"
	from("LICENSE") { rename { "LICENSE_taz" } }
}

shadowJar {
	archiveClassifier = ""
	from("LICENSE") { rename { "LICENSE_taz" } }
	configurations = []
	from(provider { zipTree(project.configurations.shade.singleFile) }) {
		// MoulConfig ships LibNinePatch's mod json and its own access widener; Taz's replace both.
		exclude "fabric.mod.json", "moulconfig.accesswidener", "META-INF/MANIFEST.MF", "assets/moulconfig/test.xml"
		rename "LICENSE", "LICENSE_moulconfig"
	}
	relocate "io.github.notenoughupdates.moulconfig", "com.taz.deps.moulconfig"
	mergeServiceFiles()
}

assemble.dependsOn shadowJar

// Dev-only: run the XP calculator against downloaded data. ./gradlew xpSmoke -PsmokeArgs="<dataDir>;<neuZip>"
tasks.register('xpSmoke', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.taz.xpassist.XpCalculatorSmoke'
	args = (project.findProperty('smokeArgs') ?: '').toString().split(';').toList()
}

// src/test only holds the xpSmoke dev harness, not unit tests.
tasks.named('test') {
	failOnNoDiscoveredTests = false
}

// The foraging tests build fake Galatea trees and honeyhives in a singleplayer world, so let them run off Galatea.
tasks.matching { it.name == 'runClientGameTest' }.configureEach {
	jvmArgs '-Dtaz.foraging.anywhere=true'
	// The dungeon tests build rooms in the flat test world.
	jvmArgs '-Dtaz.dungeons.anywhere=true'
	// Only the tests of the feature being worked on: gradlew runClientGameTest -Ptests=honeyhive (or trees, xp, settings).
	def tests = project.findProperty('tests')
	if (tests) jvmArgs "-Dtaz.tests=${tests}"
}
